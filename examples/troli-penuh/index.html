<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kenapa troli penuh susah didorong?</title>
    <link rel="stylesheet" href="../../kit/css/film.css" />
    <link rel="stylesheet" href="film.css" />
    <script src="../../node_modules/gsap/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- Eight pages of one sketchbook. Each is drawn in film.js (its SVG and its lettering) and slides in as fresh
           paper; the camera pushes inside a page. All coordinates are the real frame's: 1080 x 1920. -->
      <section class="scene page" id="pA"><div class="cam"><svg viewBox="0 0 1080 1920"></svg></div></section>
      <section class="scene page" id="pB"><div class="cam"><svg viewBox="0 0 1080 1920"></svg></div></section>
      <section class="scene page" id="pC"><div class="cam"><svg viewBox="0 0 1080 1920"></svg></div></section>
      <section class="scene page" id="pD"><div class="cam"><svg viewBox="0 0 1080 1920"></svg></div></section>
      <section class="scene page" id="pE"><div class="cam"><svg viewBox="0 0 1080 1920"></svg></div></section>
      <section class="scene page" id="pF"><div class="cam"><svg viewBox="0 0 1080 1920"></svg></div></section>
      <section class="scene page" id="pG"><div class="cam"><svg viewBox="0 0 1080 1920"></svg></div></section>
      <section class="scene page" id="pH"><div class="cam"><svg viewBox="0 0 1080 1920"></svg></div></section>
    </div>
    <script type="module" src="film.js"></script>
  </body>
</html>
