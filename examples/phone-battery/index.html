<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Where does a phone battery keep its energy?</title>
    <link rel="stylesheet" href="../../kit/css/film.css" />
    <link rel="stylesheet" href="film.css" />
    <script src="../../node_modules/gsap/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- One long whiteboard. Everything is drawn in film.js into one world (#world and its lettering), section by
           section along the board; the camera (.cam) tracks along it. Each section's own coordinates are the
           storyboard frames' coordinates (1920 x 1080), placed at its offset on the board. -->
      <section class="scene" id="board">
        <div class="ink"><div class="cam"><svg id="world" width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div></div>
      </section>
    </div>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="camblur" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0" /></filter>
    </svg>
    <script type="module" src="film.js"></script>
  </body>
</html>
